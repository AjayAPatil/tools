<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Local Reels Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#player{
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:#000;
}

#overlay{
    position:fixed;
    right:15px;
    bottom:90px;
    display:flex;
    flex-direction:column;
    gap:15px;
    z-index:20;
}

.btn{
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.2);
    color:#fff;
    font-size:28px;
    backdrop-filter:blur(8px);
}

#topbar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    gap:10px;
    z-index:30;
}

#topbar button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#fff;
}

#status{
    position:fixed;
    bottom:15px;
    left:15px;
    color:white;
    background:rgba(0,0,0,.5);
    padding:8px 12px;
    border-radius:8px;
    z-index:30;
}

input{
    display:none;
}
</style>
</head>

<body>

<div id="topbar">

<button onclick="folder.click()">📁 Select Folder</button>

<button id="shuffleBtn">Shuffle OFF</button>

<input id="folder"
type="file"
webkitdirectory
multiple
accept="video/*">

</div>

<video
id="player"
playsinline
autoplay
muted
controls
></video>

<div id="overlay">

<button id="like" class="btn">♡</button>

</div>

<div id="status">
No Videos Loaded
</div>

<script>

const folder=document.getElementById("folder");
const player=document.getElementById("player");
const status=document.getElementById("status");
const like=document.getElementById("like");
const shuffleBtn=document.getElementById("shuffleBtn");

let videos=[];
let index=0;
let shuffle=false;

const liked=new Set();

folder.onchange=e=>{

videos=[...e.target.files]
.filter(f=>f.type.startsWith("video"));

if(!videos.length){
alert("No videos found");
return;
}

index=0;
load(index);

};

function load(i){

if(!videos.length)return;

index=(i+videos.length)%videos.length;

player.src=URL.createObjectURL(videos[index]);

player.play();

status.innerHTML=(index+1)+" / "+videos.length+"<br>"+videos[index].name;

like.innerHTML=liked.has(index)?"❤":"♡";

preloadNext();

}

function preloadNext(){

let n=(index+1)%videos.length;

let v=document.createElement("video");

v.preload="metadata";

v.src=URL.createObjectURL(videos[n]);

}

function next(){

if(shuffle){

load(Math.floor(Math.random()*videos.length));

}else{

load(index+1);

}

}

function previous(){

if(shuffle){

load(Math.floor(Math.random()*videos.length));

}else{

load(index-1);

}

}

player.onended=next;

let startY=0;

document.addEventListener("touchstart",e=>{

startY=e.touches[0].clientY;

});

document.addEventListener("touchend",e=>{

let end=e.changedTouches[0].clientY;

let diff=startY-end;

if(Math.abs(diff)<40)return;

if(diff>0){

next();

}else{

previous();

}

});

document.addEventListener("wheel",e=>{

if(e.deltaY>0){

next();

}else{

previous();

}

});

like.onclick=()=>{

if(liked.has(index)){

liked.delete(index);

like.innerHTML="♡";

}else{

liked.add(index);

like.innerHTML="❤";

}

};

shuffleBtn.onclick=()=>{

shuffle=!shuffle;

shuffleBtn.innerText=shuffle?"Shuffle ON":"Shuffle OFF";

};

player.addEventListener("click",()=>{

if(player.paused){

player.play();

}else{

player.pause();

}

});

</script>

</body>
</html>

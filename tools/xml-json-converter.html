
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XML ⇄ JSON</title>
<style>
:root{
  --bg:#0e141d; --panel:#161e2b; --panel2:#1b2534; --line:#243044; --text:#d6deea;
  --muted:#6f83a0; --accent:#f5a83a; --accent-ink:#1a1206; --ok:#5fd0a0; --err:#ff7b7b;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Cascadia Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 var(--sans);display:flex;flex-direction:column}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:700}
header h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:12.5px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px;border-bottom:1px solid var(--line)}
.opts label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.opts input[type=text]{width:58px}
.sep{width:1px;height:22px;background:var(--line)}
button,select,input[type=text]{font:600 12.5px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 11px}
input[type=text]{font:12.5px var(--mono);padding:5px 7px}
button{cursor:pointer}
button:hover,select:hover{border-color:#3a4c69}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 18px 18px}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h2{margin:0 auto 0 4px;font:600 12px var(--mono);letter-spacing:.08em;color:var(--muted)}
textarea{flex:1;min-height:0;width:100%;resize:none;border:0;background:transparent;color:var(--text);font:13px/1.55 var(--mono);padding:12px 14px;tab-size:2;white-space:pre;overflow:auto}
textarea:focus{outline:none}
textarea::placeholder{color:#4d6180}
.status{padding:7px 12px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(max-width:820px){main{grid-template-columns:1fr;grid-auto-rows:minmax(320px,1fr);overflow:auto}body{height:auto;min-height:100%}}
</style>
</head>
<body>
<header>
  <h1>XML<span> ⇄ </span>JSON</h1>
  <p>Convert, format and minify — everything runs in your browser, nothing is uploaded.</p>
</header>

<div class="opts">
  <button class="primary" id="toJson">XML to JSON</button>
  <button class="primary" id="toXml">JSON to XML</button>
  <label><input type="checkbox" id="auto" checked> Auto-convert</label>
  <span class="sep"></span>
  <select id="sample" aria-label="Load sample">
    <option value="">Load sample…</option>
    <option value="xml1">XML: book catalog</option>
    <option value="xml2">XML: order with attributes</option>
    <option value="json1">JSON: users array</option>
  </select>
  <span class="sep"></span>
  <label>Indent
    <select id="indent"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="tab">Tab</option></select>
  </label>
  <label><input type="checkbox" id="types" checked> Detect numbers &amp; booleans</label>
  <label>Attribute prefix <input type="text" id="attr" value="@" maxlength="4"></label>
  <label>Text key <input type="text" id="text" value="#text" maxlength="12"></label>
  <label>Root name <input type="text" id="root" value="root" maxlength="24"></label>
  <label><input type="checkbox" id="decl" checked> XML declaration</label>
</div>

<main>
  <section class="pane" aria-label="XML">
    <div class="bar">
      <h2>XML</h2>
      <button data-act="format" data-p="xml">Format</button>
      <button data-act="minify" data-p="xml">Minify</button>
      <button data-act="copy" data-p="xml">Copy</button>
      <button data-act="download" data-p="xml">Download</button>
      <button data-act="clear" data-p="xml">Clear</button>
    </div>
    <textarea id="xml" spellcheck="false" placeholder='Paste XML here, e.g. <user id="1"><name>ajay</name></user>'></textarea>
    <div class="status" id="xmlStatus">Waiting for input…</div>
  </section>

  <section class="pane" aria-label="JSON">
    <div class="bar">
      <h2>JSON</h2>
      <button data-act="format" data-p="json">Format</button>
      <button data-act="minify" data-p="json">Minify</button>
      <button data-act="copy" data-p="json">Copy</button>
      <button data-act="download" data-p="json">Download</button>
      <button data-act="clear" data-p="json">Clear</button>
    </div>
    <textarea id="json" spellcheck="false" placeholder='Paste JSON here, e.g. { "user": { "id": 1, "name": "ajay" } }'></textarea>
    <div class="status" id="jsonStatus">Waiting for input…</div>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const el = {xml:$('xml'), json:$('json')}, st = {xml:$('xmlStatus'), json:$('jsonStatus')};

const cfg = () => ({
  indent: $('indent').value === 'tab' ? '\t' : ' '.repeat(+$('indent').value),
  types: $('types').checked,
  attr: $('attr').value,
  text: $('text').value || '#text',
  root: $('root').value.trim() || 'root',
  decl: $('decl').checked
});

/* ---------- status / toast ---------- */
function setStatus(p, msg, kind){ st[p].textContent = msg; st[p].className = 'status ' + (kind||''); st[p].title = msg; }
function info(p){
  const v = el[p].value;
  return v.length.toLocaleString() + ' chars · ' + (v ? v.split('\n').length : 0).toLocaleString() + ' lines';
}
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1400); }

/* ---------- XML parsing / printing ---------- */
function parseXml(src){
  const doc = new DOMParser().parseFromString(src, 'application/xml');
  const err = doc.getElementsByTagName('parsererror')[0];
  if (err){
    const t = err.textContent;
    const m = t.match(/error on line (\d+) at column (\d+):\s*([^\n]*)/i);
    throw new Error(m ? `Line ${m[1]}, col ${m[2]}: ${m[3]}` : t.split('\n')[0].slice(0,160));
  }
  return doc;
}
const escT = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => escT(String(s)).replace(/"/g,'&quot;');

function printNode(n, ind, lvl){
  const pretty = ind !== null, pad = pretty ? ind.repeat(lvl) : '', nl = pretty ? '\n' : '';
  switch(n.nodeType){
    case 8: return pad + '<!--' + n.nodeValue + '-->';
    case 7: return pad + '<?' + n.target + (n.data ? ' ' + n.data : '') + '?>';
    case 3: { const t = n.nodeValue.trim(); return t ? pad + escT(t) : ''; }
    case 4: return pad + '<![CDATA[' + n.nodeValue + ']]>';
    case 1: {
      const attrs = Array.from(n.attributes).map(a => ` ${a.name}="${escA(a.value)}"`).join('');
      const kids = Array.from(n.childNodes).filter(c => c.nodeType !== 3 || c.nodeValue.trim());
      if (!kids.length) return `${pad}<${n.nodeName}${attrs}/>`;
      if (kids.every(c => c.nodeType === 3 || c.nodeType === 4)){
        const inner = kids.map(c => c.nodeType === 4 ? '<![CDATA[' + c.nodeValue + ']]>' : escT(pretty ? c.nodeValue.trim() : c.nodeValue.trim())).join('');
        return `${pad}<${n.nodeName}${attrs}>${inner}</${n.nodeName}>`;
      }
      const body = kids.map(c => printNode(c, ind, lvl + 1)).filter(Boolean).join(nl);
      return `${pad}<${n.nodeName}${attrs}>${nl}${body}${nl}${pad}</${n.nodeName}>`;
    }
  }
  return '';
}
function formatXml(src, ind){
  const doc = parseXml(src);
  const decl = (src.match(/^\s*(<\?xml[^?]*\?>)/) || [])[1];
  const parts = Array.from(doc.childNodes).map(n => printNode(n, ind, 0)).filter(Boolean);
  if (decl) parts.unshift(decl);
  return parts.join(ind !== null ? '\n' : '');
}

/* ---------- XML -> JSON ---------- */
function coerce(s, o){
  if (!o.types) return s;
  if (s === 'true') return true;
  if (s === 'false') return false;
  if (/^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?$/.test(s) && s.replace(/\D/g,'').length < 16) return Number(s);
  return s;
}
function nodeToJs(e, o){
  const obj = {}; let hasAttr = false, text = '';
  for (const a of e.attributes){ obj[o.attr + a.name] = coerce(a.value, o); hasAttr = true; }
  let hasKids = false;
  for (const c of e.childNodes){
    if (c.nodeType === 3 || c.nodeType === 4) text += c.nodeValue;
    else if (c.nodeType === 1){
      hasKids = true;
      const k = c.nodeName, v = nodeToJs(c, o);
      if (k in obj){ if (Array.isArray(obj[k])) obj[k].push(v); else obj[k] = [obj[k], v]; }
      else obj[k] = v;
    }
  }
  text = text.trim();
  if (!hasKids && !hasAttr) return text === '' ? null : coerce(text, o);
  if (text !== '') obj[o.text] = coerce(text, o);
  return obj;
}
function xmlToJson(src, o){
  const doc = parseXml(src);
  return JSON.stringify({ [doc.documentElement.nodeName]: nodeToJs(doc.documentElement, o) }, null, o.indent === '' ? undefined : o.indent);
}

/* ---------- JSON -> XML ---------- */
const safeName = s => { s = String(s).replace(/[^\w.\-:]/g, '_'); return /^[A-Za-z_]/.test(s) ? s : '_' + s; };
function build(name, val, o, lvl){
  if (Array.isArray(val)) return val.map(v => build(name, v, o, lvl)).filter(Boolean).join('\n');
  const pad = o.indent.repeat(lvl), n = safeName(name);
  if (val === null || val === undefined) return `${pad}<${n}/>`;
  if (typeof val !== 'object') return `${pad}<${n}>${escT(String(val))}</${n}>`;
  let attrs = '', text = null; const kids = [];
  for (const [k, v] of Object.entries(val)){
    if (o.attr && k.startsWith(o.attr) && k.length > o.attr.length && (v === null || typeof v !== 'object'))
      attrs += ` ${safeName(k.slice(o.attr.length))}="${escA(v === null ? '' : v)}"`;
    else if (k === o.text && (v === null || typeof v !== 'object')) text = v === null ? '' : String(v);
    else { const s = build(k, v, o, lvl + 1); if (s) kids.push(s); }
  }
  if (!kids.length) return text === null ? `${pad}<${n}${attrs}/>` : `${pad}<${n}${attrs}>${escT(text)}</${n}>`;
  const t = text ? o.indent.repeat(lvl + 1) + escT(text) + '\n' : '';
  return `${pad}<${n}${attrs}>\n${t}${kids.join('\n')}\n${pad}</${n}>`;
}
function jsonToXml(src, o){
  const data = JSON.parse(src);
  const keys = data && typeof data === 'object' && !Array.isArray(data) ? Object.keys(data) : [];
  const body = keys.length === 1 && !Array.isArray(data[keys[0]])
    ? build(keys[0], data[keys[0]], o, 0)
    : build(o.root, data, o, 0);
  return (o.decl ? '<?xml version="1.0" encoding="UTF-8"?>\n' : '') + body;
}
function jsonErr(e, src){
  const m = /position (\d+)/.exec(e.message);
  if (m){
    const pos = +m[1], before = src.slice(0, pos).split('\n');
    return `Line ${before.length}, col ${before[before.length-1].length + 1}: ${e.message.replace(/ in JSON at position.*|\(line.*/,'')}`;
  }
  return e.message;
}

/* ---------- actions ---------- */
function validate(p){
  const v = el[p].value;
  if (!v.trim()) return setStatus(p, 'Waiting for input…');
  try { p === 'xml' ? parseXml(v) : JSON.parse(v); setStatus(p, 'Valid ' + p.toUpperCase() + ' · ' + info(p), 'ok'); return true; }
  catch(e){ setStatus(p, p === 'xml' ? e.message : jsonErr(e, v), 'err'); return false; }
}
function convert(from){
  const to = from === 'xml' ? 'json' : 'xml', src = el[from].value;
  if (!src.trim()){ el[to].value = ''; setStatus(to, 'Waiting for input…'); return validate(from); }
  try {
    el[to].value = from === 'xml' ? xmlToJson(src, cfg()) : jsonToXml(src, cfg());
    validate(from); validate(to); return true;
  } catch(e){
    setStatus(from, from === 'xml' ? e.message : jsonErr(e, src), 'err'); return false;
  }
}
function tidy(p, minify){
  const v = el[p].value; if (!v.trim()) return;
  const o = cfg();
  try {
    if (p === 'json') el.json.value = JSON.stringify(JSON.parse(v), null, minify ? undefined : o.indent);
    else el.xml.value = formatXml(v, minify ? null : o.indent);
    validate(p);
    if ($('auto').checked) convert(p);
  } catch(e){ setStatus(p, p === 'xml' ? e.message : jsonErr(e, v), 'err'); }
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); }
  catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('Copied');
}
function download(p){
  const v = el[p].value; if (!v) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v], {type: p === 'xml' ? 'application/xml' : 'application/json'}));
  a.download = 'data.' + p; a.click(); URL.revokeObjectURL(a.href);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const p = b.dataset.p, act = b.dataset.act;
  if (act === 'format') tidy(p, false);
  else if (act === 'minify') tidy(p, true);
  else if (act === 'copy'){ if (el[p].value) copyText(el[p].value); }
  else if (act === 'download') download(p);
  else if (act === 'clear'){ el[p].value = ''; setStatus(p, 'Waiting for input…'); el[p].focus(); }
});
$('toJson').onclick = () => convert('xml');
$('toXml').onclick = () => convert('json');

let timer;
['xml','json'].forEach(p => el[p].addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => $('auto').checked ? convert(p) : validate(p), 250);
}));
['indent','types','attr','text','root','decl'].forEach(id => $(id).addEventListener('change', () => {
  if (!$('auto').checked) return;
  if (el.xml.value.trim()) convert('xml'); else if (el.json.value.trim()) convert('json');
}));

const samples = {
  xml1: `<?xml version="1.0" encoding="UTF-8"?>
<catalog>
  <book id="bk101" available="true">
    <author>Gambardella, Matthew</author>
    <title>XML Developer's Guide</title>
    <price>44.95</price>
    <tags><tag>xml</tag><tag>guide</tag></tags>
  </book>
  <book id="bk102" available="false">
    <author>Ralls, Kim</author>
    <title>Midnight Rain</title>
    <price>5.95</price>
    <notes/>
  </book>
</catalog>`,
  xml2: `<order id="A-1042" currency="INR">
  <!-- shipment details -->
  <customer>Kale Logistics</customer>
  <items>
    <item sku="P-1" qty="2">Freight charge</item>
    <item sku="P-2" qty="1">Handling fee</item>
  </items>
  <note><![CDATA[Fragile & urgent <handle with care>]]></note>
</order>`,
  json1: `{
  "users": {
    "user": [
      { "@id": 1, "name": "ajay", "active": true, "roles": ["admin", "dev"] },
      { "@id": 2, "name": "meera", "active": false, "manager": null }
    ]
  }
}`
};
$('sample').onchange = e => {
  const k = e.target.value; if (!k) return;
  const p = k.startsWith('xml') ? 'xml' : 'json';
  el[p].value = samples[k]; convert(p); e.target.value = '';
};
</script>
</body>
</html>

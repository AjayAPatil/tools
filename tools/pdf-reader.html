<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Reader</title>
<style>
:root{--bg:#fbfaf7;--fg:#222;--muted:#777;--bar:#fff;--line:#e4e1da;--accent:#2f6fed}
[data-theme=sepia]{--bg:#f4ecd8;--fg:#3b3226;--muted:#8a7b63;--bar:#efe5cc;--line:#dccfae;--accent:#9a5b1a}
[data-theme=dark]{--bg:#16181c;--fg:#d9dbe0;--muted:#8b909a;--bar:#1f2227;--line:#2c3036;--accent:#7aa2ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
button,select,.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#size{min-width:3.6em;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#pos{color:var(--accent);font-size:.85rem;font-variant-numeric:tabular-nums}
#title{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.9rem}
input[type=file]{display:none}
main{max-width:46em;margin:0 auto;padding:28px 20px 90px}
#doc{font-family:Georgia,'Times New Roman',serif;line-height:1.7;font-size:20px;overflow-wrap:break-word}
#doc p{margin:0 0 1em}
#doc h2{font-family:system-ui,sans-serif;line-height:1.3;margin:1.6em 0 .6em;font-size:1.25em}
.pg{text-align:center;color:var(--muted);font:.7em system-ui,sans-serif;margin:2.2em 0 1.4em;display:flex;align-items:center;gap:12px}
.pg::before,.pg::after{content:"";flex:1;border-top:1px solid var(--line)}
#empty{text-align:center;margin-top:18vh;color:var(--muted)}
#empty h1{color:var(--fg);font-weight:600}
#empty .btn{display:inline-block;margin-top:14px;font-size:1.05rem;padding:10px 22px}
body.drag main{outline:3px dashed var(--accent);outline-offset:-12px}
#msg{text-align:center;color:var(--muted);margin-top:30px}
</style>
</head>
<body>
<header id="hdr">
  <label class="btn primary" for="file">Open PDF</label>
  <input id="file" type="file" accept="application/pdf,.pdf">
  <button id="dec" title="Smaller text (-)" aria-label="Smaller text">A−</button>
  <span id="size">100%</span>
  <button id="inc" title="Larger text (+)" aria-label="Larger text">A+</button>
  <select id="theme" aria-label="Theme"><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select>
  <span id="pos"></span>
  <span id="title"></span>
</header>
<main>
  <div id="empty"><h1>PDF Reader</h1><p>Open or drop a PDF to read it as clean, resizable text.<br>Works fully offline.</p><br><label class="btn primary" for="file">Open PDF</label><p id="last"></p></div>
  <article id="doc"></article>
  <div id="msg"></div>
</main>
